<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SIGNAL ARENA — Департамент управляемой паники</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; background: #07080c; overflow: hidden; }
      body { font-family: Inter, system-ui, sans-serif; }
      #game { width: 100vw; height: 100vh; }
      canvas { display: block; image-rendering: auto; }
      #boot-veil {
        position: fixed; inset: 0; display: grid; place-items: center; z-index: 9;
        background: #07080c; color: #e8e2d6; font-family: Oswald, sans-serif;
        letter-spacing: .3em; text-transform: uppercase; font-size: 13px;
        transition: opacity .5s ease; pointer-events: none;
      }
      #boot-veil.gone { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot-veil">Signal Arena · загрузка протокола</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
