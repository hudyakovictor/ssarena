    <title>Signal Arena · Proof of Skill · GameFi 2.0</title>
    
    <style>
      :root {
        --signal: #22d3ee;
        --short: #fb4b6b;
        --long: #2bd47f;
        --gold: #fbbf24;
        --grape: #8b5cf6;
        --amber: #f59e0b;
        --pink: #ec4899;
        --blue: #4f8cff;
        --void: #05070f;
        --ink: #e2e8f0;
        --inkSoft: #94a3b8;
        --inkDim: #5e6d85;
        --edge: rgba(255,255,255,0.06);
      }
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      
      body {
        font-family: 'Inter', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--void);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      
      /* Loading screen */
      .loading-screen {
        position: fixed;
        inset: 0;
        background: var(--void);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-logo {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        animation: pulse 2s infinite;
      }
      
      .loading-text {
        font-family: 'Space Mono', monospace;
        font-size: 0.75rem;
        color: var(--inkDim);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 2rem;
      }
      
      .loading-bar {
        width: 200px;
        height: 2px;
        background: var(--edge);
        border-radius: 1px;
        overflow: hidden;
      }
      
      .loading-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--signal), var(--long));
        border-radius: 1px;
        animation: loading 1.5s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      
      @keyframes loading {
        0% { width: 0%; margin-left: 0; }
        50% { width: 100%; margin-left: 0; }
        100% { width: 0%; margin-left: 100%; }
      }
      
      /* Splash text */
      .splash-quote {
        font-family: 'Space Mono', monospace;
        font-size: 0.65rem;
        color: var(--inkDim);
        margin-top: 1.5rem;
        text-align: center;
        max-width: 300px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading" class="loading-screen">
      <div class="loading-logo">⚔️</div>
      <div class="loading-text">Signal Arena · Initializing</div>
      <div class="loading-bar">
        <div class="loading-bar-fill"></div>
      </div>
      <div class="splash-quote">
        "A crypto game that makes you smarter, not poorer."
      </div>
    </div>
    
    <!-- App Root -->
    <div id="root"></div>
    
    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
    
    <!-- Hide loading screen after app loads -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loading = document.getElementById('loading');
          if (loading) {
            loading.classList.add('hidden');
            setTimeout(function() { loading.remove(); }, 500);
          }
        }, 800);
      });
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
